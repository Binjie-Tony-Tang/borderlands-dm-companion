<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../library_page/lorekeeper.css?v=dashboard-tabs">
  <script defer src="../library_page/lorekeeper.js?v=lorekeeper-voice"></script>
  <title>The Keep · Borderlands</title>
  <link rel="stylesheet" href="../character_page/styles.css?v=dashboard-tabs">
  <script defer src="../character_page/dashboard-nav.js"></script>
  <link rel="stylesheet" href="keep.css?v=dashboard-tabs">
  <script defer src="../adventure_page/private-config.js"></script>
  <script defer src="../character_page/classes.js"></script>
  <script defer src="../api/level-data.js"></script>
  <script defer src="../character_page/levels.js"></script>
  <script defer src="../character_page/origins.js"></script>
  <script defer src="../character_page/items-spells.js"></script>
  <script defer src="../character_page/adventure-catalog.js"></script>
  <script defer src="../character_page/character.js"></script>
  <script defer src="../character_page/storage.js?v=combat-v1"></script>
  <script defer src="../character_page/dashboard-controls.js?v=combat-v1"></script>
  <script defer src="content.js?v=adventure-maps"></script>
  <script defer src="transactions.js?v=adventure-maps"></script>
  <script defer src="../combat_page/handoff.js?v=combat-roster"></script>
  <script defer src="../combat_page/engine.js?v=adventure-effects"></script>
  <script defer src="../character_page/session-state.js?v=adventure-effects"></script>
  <script defer src="../adventure_page/hazards.js?v=adventure-effects"></script>
  <link rel="stylesheet" href="../adventure_page/hazards.css?v=adventure-effects">
  <script defer src="keep.js?v=combat-roster"></script>
</head>
<body>
  <header class="masthead" data-dashboard-page="keep"></header>
  <main class="keep-shell">
    <header class="keep-header">
      <div><p class="keep-kicker">HEROES OF THE BORDERLANDS</p><h1>Keep on the Borderlands</h1></div>
      <div class="keep-actions">
        <button id="draw-scene" class="secondary" type="button">Random encounter</button>
        <button id="call-watch" class="watch-button" type="button">Call the Watch</button>
      </div>
    </header>
    <p id="keep-status" class="status keep-status" role="status" hidden></p>
    <div class="keep-board">
      <section class="map-panel" aria-label="Map and locations">
        <div class="map-image">
          <img src="../database/maps/keep-on-the-borderlands/keep-on-the-borderlands-redraw-v1.png" width="1525" height="1031" alt="Illustrated overview of the Keep, with fourteen numbered locations">
          <div id="map-pins" class="map-pins"></div>
        </div>
        <nav id="place-list" class="place-list" aria-label="Keep locations"></nav>
      </section>
      <section id="place-panel" class="keep-panel place-panel" aria-label="Selected location"></section>
      <aside class="keep-panel party-panel" aria-labelledby="keep-party-title">
        <h2 id="keep-party-title">Party</h2>
        <p id="party-caption" class="muted">Loading roster…</p>
        <div id="party-list" class="buyer-list"></div>
        <details class="side-details">
          <summary>Keep time</summary>
          <form id="clock-form" class="clock-form">
            <label>Day <input id="keep-day" type="number" min="1" max="999" required></label>
            <label>Hour <input id="keep-hour" type="number" min="0" max="23" required></label>
            <button class="secondary" type="submit">Set time</button>
          </form>
        </details>
        <details class="side-details">
          <summary>Session log</summary>
          <ol id="keep-log" class="keep-log"></ol>
        </details>
      </aside>
    </div>
  </main>
  <dialog id="checkout" class="keep-dialog" aria-labelledby="checkout-title">
    <form id="checkout-form">
      <div class="checkout-head">
        <h2 id="checkout-title">Purchase</h2>
        <button class="text-button" type="button" id="checkout-close">Cancel</button>
      </div>
      <div id="checkout-fields" class="checkout-fields"></div>
      <div id="checkout-preview" class="checkout-preview" role="status" aria-live="polite"></div>
      <div class="checkout-footer"><button id="checkout-confirm" class="primary" type="submit">Confirm purchase</button></div>
    </form>
  </dialog>
</body>
</html>
